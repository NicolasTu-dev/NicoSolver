<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My account Solverix</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/cuenta.css">
</head>
<body>

<nav>
  <div class="nav-row">
    <div class="brand"><span class="mark">♠</span> Solverix</div>
    <div class="nav-right">
      <select class="lang-switch" id="langSwitch">
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="pt">PT</option>
      </select>
      <a class="back-link" href="index.html" data-i18n="backLink">← Back to home</a>
    </div>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-head">
    <h1 data-i18n="pageTitle">🔑 My account</h1>
    <p data-i18n="pageSubtitle">Log in or sign up to get a plan and download Solverix.</p>
  </div>

  <div id="mpBannerArea"></div>

  <div class="account-card" id="accountCard">
    <div id="loginBlock">
      <div class="acc-field-label" data-i18n="labelEmail">Email</div>
      <input class="acc-input" id="accEmail" type="email" autocomplete="username">
      <div class="acc-field-label" data-i18n="labelPassword">Password</div>
      <input class="acc-input" id="accPassword" type="password" autocomplete="current-password">
      <div class="acc-actions">
        <button class="btn btn-gold" id="accLoginBtn" data-i18n="btnLogin">Log in</button>
        <button class="btn btn-ghost" id="accRegisterBtn" data-i18n="btnRegister">Sign up</button>
      </div>
      <div class="acc-status" id="accStatus"></div>
    </div>
    <div id="loggedInBlock" style="display:none;">
      <div class="acc-row">
        <div class="acc-plan" id="accPlanRow"><span class="dot-on" id="accPlanDot"></span><span id="accPlanName">Complete Plan</span><span id="accPlanStatus"></span></div>
        <div class="acc-days" id="accDays"></div>
      </div>
      <div id="streamerBadge" style="display:none;"></div>
      <div class="acc-sub" id="accExpiry"></div>
      <div id="accDownloadArea" style="margin-top:20px;"></div>
      <a href="#" id="accLogoutLink" style="display:block; margin-top:14px; font-size:12.5px; color:var(--muted-2); text-decoration:underline;" data-i18n="logoutLink">Log out</a>
    </div>
  </div>

  <div class="founder-panel" id="founderPanel" style="display:none;">
    <div class="founder-title" data-i18n="founderTitle">Manage accounts</div>
    <input class="acc-input" id="founderSearch" data-i18n-placeholder="founderSearchPlaceholder" placeholder="Search by email...">
    <div class="founder-results" id="founderResults"></div>
    <div class="founder-assign" id="founderAssign">
      <div class="founder-selected" id="founderSelectedEmail"></div>

      <div class="founder-subtitle" data-i18n="founderGrantTitle">Grant subscription</div>
      <div class="acc-field-label" data-i18n="founderPlanLabel">Plan</div>
      <select class="acc-input" id="founderPlan">
        <option value="advanced" data-i18n="founderPlanAdvanced">Advanced Solver</option>
        <option value="complete" data-i18n="founderPlanComplete">Complete</option>
      </select>
      <div class="acc-field-label" data-i18n="founderDaysLabel">Days</div>
      <input class="acc-input" id="founderDays" type="number" min="1" value="30">
      <button class="btn btn-gold" id="founderGrantBtn" style="margin-top:14px; width:100%;" data-i18n="founderGrantBtn">Grant subscription</button>

      <div class="founder-subtitle" style="margin-top:22px;" data-i18n="founderStreamerTitle">Assign streamer role</div>
      <div class="acc-field-label" data-i18n="founderCodeLabel">Streamer code</div>
      <input class="acc-input" id="founderCode" style="text-transform:uppercase;">
      <div class="acc-field-label" data-i18n="founderNameLabel">Display name</div>
      <input class="acc-input" id="founderName">
      <button class="btn btn-ghost" id="founderAssignBtn" style="margin-top:14px; width:100%;" data-i18n="founderAssignBtn">Assign streamer role</button>
    </div>
    <div class="acc-status" id="founderStatus"></div>

    <div style="margin-top:22px; padding-top:16px; border-top:1px solid var(--border);">
      <div class="founder-subtitle" data-i18n="founderPayoutsTitle">Streamer payouts</div>
      <button class="btn btn-ghost" id="founderPayoutsToggle" style="width:100%;" data-i18n="founderPayoutsBtn">View streamer payouts</button>
      <div id="founderPayoutsList" style="margin-top:10px;"></div>
      <div class="acc-status" id="founderPayoutsStatus"></div>
    </div>
  </div>

  <div class="acc-footer-links">
    <a href="privacidad.html" data-i18n="footerPrivacy">Privacy Policy</a>
    <a href="terminos.html" data-i18n="footerTerms">Terms of Service</a>
    <a href="mailto:soporte@solverix.com.ar">soporte@solverix.com.ar</a>
  </div>
</div>

<div class="cookie-banner" id="cookieBanner">
  <p id="cookieBannerText"></p>
  <button class="btn btn-gold" id="cookieAcceptBtn"></button>
</div>

<script src="js/shared.js"></script>
<script src="js/cuenta.js"></script>

</body>
</html>
