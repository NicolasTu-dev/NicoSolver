<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My account — Solverix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a1810;
    --bg-deep: #06120b;
    --panel: #132118;
    --border: #2a4a38;
    --gold: #d4af37;
    --gold-bright: #e8c250;
    --text: #e8f0ea;
    --muted: #8fb39f;
    --muted-2: #5c7a6a;
    --green: #22c55e;
    --red: #ff5c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(1100px 520px at 82% -6%, rgba(212,175,55,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Inter","Segoe UI",sans-serif;
    line-height:1.55;
  }
  a{color:inherit;}
  h1,h2{font-family:"Cinzel","Segoe UI",serif; font-weight:700; margin:0;}
  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(10,24,16,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; max-width:640px; margin:0 auto; gap:14px;}
  .brand{display:flex; align-items:center; gap:10px; font-family:"Cinzel",serif; font-weight:700; font-size:19px;}
  .brand .mark{color:var(--gold); font-size:20px;}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .back-link{font-size:13.5px; color:var(--muted); text-decoration:none;}
  .back-link:hover{color:var(--text);}
  .lang-switch{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:12.5px;
    padding:7px 12px; border-radius:8px; cursor:pointer;
  }
  .lang-switch:hover{border-color:var(--gold); color:var(--gold-bright);}
  .page-wrap{max-width:640px; margin:0 auto; padding:56px 24px;}
  .page-head{text-align:center; margin-bottom:32px;}
  .page-head h1{font-size:26px;}
  .page-head p{color:var(--muted); font-size:14px; margin-top:10px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:8px; cursor:pointer;
    font-family:"Inter",sans-serif; font-weight:700; font-size:14px;
    padding:11px 22px; text-decoration:none; transition:transform .15s, background .15s;
  }
  .btn-gold{background:var(--gold); color:#14231a;}
  .btn-gold:hover{background:var(--gold-bright); transform:translateY(-1px);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--gold); color:var(--gold-bright);}

  .account-card{
    background:var(--panel); border:1px solid var(--border); border-left:6px solid var(--green);
    border-radius:4px 14px 14px 4px; padding:30px 32px;
  }
  .account-card .acc-row{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;}
  .account-card .acc-plan{font-size:19px; font-weight:800;}
  .account-card .acc-plan .dot-on{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--green); margin-right:8px; box-shadow:0 0 8px var(--green);}
  .account-card .acc-days{font-family:"Space Grotesk",sans-serif; font-weight:700; color:var(--gold-bright); font-size:15px;}
  .account-card .acc-sub{color:var(--muted); font-size:13.5px; margin-top:6px;}
  .acc-field-label{font-size:12.5px; color:var(--muted); margin:14px 0 6px;}
  .acc-input{
    width:100%; background:var(--bg-deep); border:1px solid var(--border); border-radius:8px;
    padding:11px 14px; color:var(--text); font-family:"Inter",sans-serif; font-size:14px;
  }
  .acc-input:focus{outline:none; border-color:var(--gold);}
  .acc-actions{display:flex; gap:12px; margin-top:22px;}
  .acc-actions .btn{flex:1;}
  .acc-status{margin-top:14px; font-size:13px; min-height:0;}
  .acc-status.err{color:var(--red);}
  .acc-status.ok{color:var(--green);}
  .acc-status.info{color:var(--muted);}
  .acc-download-btn{width:100%; justify-content:center;}
  .acc-plan-pick{display:flex; gap:10px; margin-top:12px;}
  .acc-plan-pick .btn{flex:1; font-size:12.5px; padding:12px 8px;}
  .mp-banner{
    background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--gold);
    padding:14px 20px; margin:0 0 24px; border-radius:8px; font-size:14px;
  }
  .code-toggle{
    background:none; border:none; cursor:pointer; padding:0;
    color:var(--muted); font-family:"Inter",sans-serif; font-size:12.5px;
    display:flex; align-items:center; gap:6px;
  }
  .code-toggle:hover{color:var(--text);}
  .code-toggle .arrow{display:inline-block; transition:transform .15s; font-size:10px;}
  .code-toggle.open .arrow{transform:rotate(90deg);}
  .code-body{display:none; margin-top:10px;}
  .code-body.open{display:block;}
  .pay-back{
    background:none; border:none; cursor:pointer; padding:0; margin-bottom:14px;
    color:var(--muted); font-family:"Inter",sans-serif; font-size:12.5px;
  }
  .pay-back:hover{color:var(--text);}
  .pay-option{
    display:block; width:100%; text-align:left; border-radius:10px; padding:16px 18px;
    margin-bottom:12px; border:1px solid var(--border); background:var(--bg-deep); cursor:pointer;
  }
  .pay-option:disabled{cursor:not-allowed; opacity:0.55;}
  .pay-option:not(:disabled):hover{border-color:var(--gold);}
  .pay-option .pay-region{font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); font-weight:700;}
  .pay-option .pay-method{font-size:16px; font-weight:800; margin-top:4px;}
  .pay-option .pay-note{font-size:12px; color:var(--muted-2); margin-top:4px;}
  .pay-option.featured{border-color:var(--gold);}
  .streamer-badge{
    display:inline-flex; align-items:center; gap:6px; margin-top:8px;
    background:rgba(212,175,55,0.12); border:1px solid rgba(212,175,55,0.4); color:var(--gold-bright);
    font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:99px;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-row">
    <div class="brand"><span class="mark">♠</span> Solverix</div>
    <div class="nav-right">
      <button class="lang-switch" id="langSwitch" type="button">ES</button>
      <a class="back-link" href="index.html" data-i18n="backLink">← Back to home</a>
    </div>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-head">
    <h1 data-i18n="pageTitle">🔑 My account</h1>
    <p data-i18n="pageSubtitle">Log in or sign up to get a plan and download Solverix.</p>
  </div>

  <div id="mpBannerArea"></div>

  <div class="account-card" id="accountCard">
    <div id="loginBlock">
      <div class="acc-field-label" data-i18n="labelEmail">Email</div>
      <input class="acc-input" id="accEmail" type="email" autocomplete="username">
      <div class="acc-field-label" data-i18n="labelPassword">Password</div>
      <input class="acc-input" id="accPassword" type="password" autocomplete="current-password">
      <div class="acc-actions">
        <button class="btn btn-gold" id="accLoginBtn" data-i18n="btnLogin">Log in</button>
        <button class="btn btn-ghost" id="accRegisterBtn" data-i18n="btnRegister">Sign up</button>
      </div>
      <div class="acc-status" id="accStatus"></div>
    </div>
    <div id="loggedInBlock" style="display:none;">
      <div class="acc-row">
        <div class="acc-plan" id="accPlanRow"><span class="dot-on" id="accPlanDot"></span><span id="accPlanName">Complete Plan</span><span id="accPlanStatus"></span></div>
        <div class="acc-days" id="accDays"></div>
      </div>
      <div id="streamerBadge" style="display:none;"></div>
      <div class="acc-sub" id="accExpiry"></div>
      <div id="accDownloadArea" style="margin-top:20px;"></div>
      <a href="#" id="accLogoutLink" style="display:block; margin-top:14px; font-size:12.5px; color:var(--muted-2); text-decoration:underline;" data-i18n="logoutLink">Log out</a>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://solverix-api-nicolastu-devs-projects.vercel.app';
  const DOWNLOAD_URL = 'https://github.com/NicolasTu-dev/NicoSolver/releases/download/solverix-v1/Solverix.zip';
  const PLAN_NAMES_EN = { none: 'No subscription', advanced: 'Advanced Solver', complete: 'Complete' };
  const PLAN_NAMES_ES = { none: 'Sin suscripción', advanced: 'Solver Avanzado', complete: 'Completo' };

  // Affiliate link tracking: ?ref=codigo gets remembered for checkout,
  // even if the visitor lands here directly instead of via the landing.
  (function(){
    const ref = new URLSearchParams(window.location.search).get('ref');
    if(ref) localStorage.setItem('solverix_ref', ref.trim().toLowerCase());
  })();

  // ---------- Language switch (EN default, ES optional) ----------
  const ES_TEXT = {
    backLink: '← Volver al inicio',
    pageTitle: '🔑 Mi cuenta',
    pageSubtitle: 'Iniciá sesión o registrate para adquirir un plan y descargar Solverix.',
    labelEmail: 'Email',
    labelPassword: 'Contraseña',
    btnLogin: 'Iniciar sesión',
    btnRegister: 'Registrarme',
    logoutLink: 'Cerrar sesión',
  };
  const EN_TEXT = {};
  document.querySelectorAll('[data-i18n]').forEach(el => { EN_TEXT[el.getAttribute('data-i18n')] = el.innerHTML; });

  function currentLang(){ return localStorage.getItem('solverix_lang') || 'en'; }

  function applyLang(lang){
    const dict = lang === 'es' ? ES_TEXT : EN_TEXT;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.documentElement.lang = lang;
    document.getElementById('langSwitch').textContent = lang === 'es' ? 'EN' : 'ES';
    localStorage.setItem('solverix_lang', lang);
  }
  applyLang(currentLang());
  document.getElementById('langSwitch').addEventListener('click', () => {
    applyLang(currentLang() === 'es' ? 'en' : 'es');
  });

  // ---------- Mercado Pago return handling ----------
  (function(){
    const params = new URLSearchParams(window.location.search);
    const mpStatus = params.get('mp');
    if(!mpStatus) return;
    const messages = {
      en: {
        success: '✅ Payment received! Log in below to see your active plan and download Solverix.',
        pending: '⏳ Your payment is pending approval. Log in again in a few minutes to check the status.',
        failure: '❌ The payment wasn\'t completed. You can try again by logging in below.',
      },
      es: {
        success: '✅ ¡Pago recibido! Iniciá sesión abajo para ver tu plan activo y descargar Solverix.',
        pending: '⏳ Tu pago está pendiente de aprobación. Iniciá sesión en unos minutos para ver el estado.',
        failure: '❌ El pago no se completó. Podés intentarlo de nuevo iniciando sesión abajo.',
      },
    };
    const set = messages[currentLang()] || messages.en;
    if(set[mpStatus]){
      const banner = document.createElement('div');
      banner.className = 'mp-banner';
      banner.textContent = set[mpStatus];
      document.getElementById('mpBannerArea').appendChild(banner);
    }
  })();

  const loginBlock = document.getElementById('loginBlock');
  const loggedInBlock = document.getElementById('loggedInBlock');
  const accEmail = document.getElementById('accEmail');
  const accPassword = document.getElementById('accPassword');
  const accStatus = document.getElementById('accStatus');
  const accLoginBtn = document.getElementById('accLoginBtn');
  const accRegisterBtn = document.getElementById('accRegisterBtn');
  const accPlanName = document.getElementById('accPlanName');
  const accDays = document.getElementById('accDays');
  const accExpiry = document.getElementById('accExpiry');
  const accDownloadArea = document.getElementById('accDownloadArea');
  const accLogoutLink = document.getElementById('accLogoutLink');

  function setStatus(msgEn, msgEs, kind){
    accStatus.textContent = currentLang() === 'es' ? msgEs : msgEn;
    accStatus.className = 'acc-status' + (kind ? ' ' + kind : '');
  }

  function daysUntil(iso){
    if(!iso) return 0;
    const ms = new Date(iso).getTime() - Date.now();
    return Math.max(0, Math.ceil(ms / 86400000));
  }

  async function apiCall(path, body){
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return res.json().catch(() => ({ ok: false, error: 'bad_response' }));
  }

  function renderStreamerBadge(streamer){
    const badgeEl = document.getElementById('streamerBadge');
    if(!streamer){ badgeEl.style.display = 'none'; badgeEl.innerHTML = ''; return; }
    const lang = currentLang();
    const label = lang === 'es' ? 'Streamer' : 'Streamer';
    badgeEl.style.display = 'block';
    badgeEl.innerHTML = '<span class="streamer-badge">🎥 ' + label + ' · ' + streamer.code.toUpperCase() + '</span>';
  }

  function showLoggedIn(email, plan, expiresAt, streamer){
    loginBlock.style.display = 'none';
    loggedInBlock.style.display = 'block';
    const lang = currentLang();
    const planNames = lang === 'es' ? PLAN_NAMES_ES : PLAN_NAMES_EN;
    accPlanName.textContent = planNames[plan] || plan;
    accDays.textContent = daysUntil(expiresAt) + (lang === 'es' ? ' días restantes' : ' days left');
    accExpiry.textContent = (lang === 'es' ? 'Vence el ' : 'Expires on ') + new Date(expiresAt).toLocaleDateString(lang === 'es' ? 'es-AR' : 'en-US');
    const dlLabel = lang === 'es' ? '⬇ Descargar Solverix' : '⬇ Download Solverix';
    const dlNote = lang === 'es'
      ? 'La app desbloquea tu plan automáticamente al iniciar sesión adentro.'
      : 'The app unlocks your plan automatically when you log in inside it.';
    document.getElementById('accPlanDot').style.display = '';
    document.getElementById('accPlanStatus').textContent = lang === 'es' ? ' — activo' : ' — active';
    renderStreamerBadge(streamer);
    accDownloadArea.innerHTML =
      '<a class="btn btn-gold acc-download-btn" href="' + DOWNLOAD_URL + '">' + dlLabel + '</a>' +
      '<div style="font-size:11.5px; color:var(--muted-2); margin-top:8px; text-align:center;">' + dlNote + '</div>';
  }

  function showNoPlan(email, streamer){
    renderStreamerBadge(streamer);
    loginBlock.style.display = 'none';
    loggedInBlock.style.display = 'block';
    const lang = currentLang();
    const planNames = lang === 'es' ? PLAN_NAMES_ES : PLAN_NAMES_EN;
    accPlanName.textContent = planNames.none;
    document.getElementById('accPlanDot').style.display = 'none';
    document.getElementById('accPlanStatus').textContent = '';
    accDays.textContent = '';
    accExpiry.textContent = lang === 'es' ? 'Adquirí un plan para poder descargar Solverix.' : 'Get a plan to download Solverix.';
    const advLabel = lang === 'es' ? 'Adquirir Avanzado' : 'Get Advanced';
    const compLabel = lang === 'es' ? 'Adquirir Completo' : 'Get Complete';
    const codeToggleLabel = lang === 'es' ? '¿Tenés un código de streamer?' : 'Have a streamer code?';
    const codeLabel = lang === 'es' ? 'Código de streamer' : 'Streamer code';
    const savedCode = localStorage.getItem('solverix_ref') || '';
    accDownloadArea.innerHTML =
      '<button type="button" class="code-toggle' + (savedCode ? ' open' : '') + '" id="codeToggle"><span class="arrow">▸</span>' + codeToggleLabel + '</button>' +
      '<div class="code-body' + (savedCode ? ' open' : '') + '" id="codeBody">' +
      '<div class="acc-field-label">' + codeLabel + '</div>' +
      '<input class="acc-input" id="affiliateCodeInput" style="text-transform:uppercase;" value="' + savedCode + '">' +
      '</div>' +
      '<div class="acc-plan-pick">' +
      '<button class="btn btn-ghost" id="pickAdvanced">' + advLabel + '</button>' +
      '<button class="btn btn-gold" id="pickComplete">' + compLabel + '</button>' +
      '</div>' +
      '<div id="checkoutStatus" class="acc-status"></div>';
    document.getElementById('codeToggle').addEventListener('click', () => {
      document.getElementById('codeToggle').classList.toggle('open');
      document.getElementById('codeBody').classList.toggle('open');
    });
    document.getElementById('pickAdvanced').onclick = () => showPaymentOptions(email, 'advanced');
    document.getElementById('pickComplete').onclick = () => showPaymentOptions(email, 'complete');
  }

  function showPaymentOptions(email, plan){
    const lang = currentLang();
    const backLabel = lang === 'es' ? '← Elegir otro plan' : '← Choose a different plan';
    const binanceRegion = lang === 'es' ? 'Resto del mundo' : 'Rest of the world';
    const binanceNote = lang === 'es' ? 'Próximamente' : 'Coming soon';
    const mpRegion = lang === 'es' ? 'Argentina' : 'Argentina';
    const mpNote = lang === 'es' ? 'Pesos argentinos, tarjeta o saldo en cuenta' : 'Argentine pesos, card or account balance';
    accDownloadArea.innerHTML =
      '<button type="button" class="pay-back" id="payBack">' + backLabel + '</button>' +
      '<button type="button" class="pay-option featured" id="payBinance" disabled>' +
      '<div class="pay-region">' + binanceRegion + '</div>' +
      '<div class="pay-method">Binance Pay</div>' +
      '<div class="pay-note">' + binanceNote + '</div>' +
      '</button>' +
      '<button type="button" class="pay-option" id="payMp">' +
      '<div class="pay-region">' + mpRegion + '</div>' +
      '<div class="pay-method">Mercado Pago</div>' +
      '<div class="pay-note">' + mpNote + '</div>' +
      '</button>' +
      '<div id="checkoutStatus" class="acc-status"></div>';
    document.getElementById('payBack').onclick = () => showNoPlan(email);
    document.getElementById('payMp').onclick = () => startCheckout(email, plan);
  }

  async function startCheckout(email, plan){
    const statusEl = document.getElementById('checkoutStatus');
    const lang = currentLang();
    if(statusEl){ statusEl.textContent = lang === 'es' ? 'Abriendo Mercado Pago...' : 'Opening Mercado Pago...'; statusEl.className = 'acc-status info'; }
    const ref = localStorage.getItem('solverix_ref') || undefined;
    const result = await apiCall('/api/create-checkout', { email, plan, ref });
    if(!result.ok || !result.checkoutUrl){
      if(statusEl){ statusEl.textContent = lang === 'es' ? 'No se pudo iniciar el pago. Probá de nuevo.' : 'Couldn\'t start the payment. Try again.'; statusEl.className = 'acc-status err'; }
      return;
    }
    window.location.href = result.checkoutUrl;
  }

  accLoginBtn.addEventListener('click', async () => {
    const email = accEmail.value.trim();
    const password = accPassword.value;
    if(!email || !password){ setStatus('Fill in your email and password.', 'Completá email y contraseña.', 'err'); return; }
    setStatus('Connecting...', 'Conectando...', 'info');
    const result = await apiCall('/api/login', { email, password });
    if(!result.ok){
      const invalid = result.error === 'invalid_credentials';
      setStatus(
        invalid ? 'Incorrect email or password.' : 'Couldn\'t connect.',
        invalid ? 'Email o contraseña incorrectos.' : 'No se pudo conectar.',
        'err'
      );
      return;
    }
    if(result.active){
      showLoggedIn(email, result.plan, result.expiresAt, result.streamer);
    }else{
      showNoPlan(email, result.streamer);
    }
  });

  accRegisterBtn.addEventListener('click', async () => {
    const email = accEmail.value.trim();
    const password = accPassword.value;
    if(!email || !password){ setStatus('Fill in your email and password.', 'Completá email y contraseña.', 'err'); return; }
    setStatus('Creating account...', 'Creando cuenta...', 'info');
    const result = await apiCall('/api/register', { email, password });
    if(!result.ok){
      const messagesEn = {
        email_already_registered: 'That email is already registered — log in instead.',
        password_too_short: 'The password needs at least 4 characters.',
      };
      const messagesEs = {
        email_already_registered: 'Ese email ya está registrado — iniciá sesión.',
        password_too_short: 'La contraseña necesita al menos 4 caracteres.',
      };
      setStatus(
        messagesEn[result.error] || 'Couldn\'t register.',
        messagesEs[result.error] || 'No se pudo registrar.',
        'err'
      );
      return;
    }
    setStatus('Account created! Now tap "Log in".', '¡Cuenta creada! Ahora tocá "Iniciar sesión".', 'ok');
  });

  accLogoutLink.addEventListener('click', (e) => {
    e.preventDefault();
    loggedInBlock.style.display = 'none';
    loginBlock.style.display = 'block';
    accEmail.value = '';
    accPassword.value = '';
    setStatus('', '', '');
  });

</script>

</body>
</html>
