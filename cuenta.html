<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi cuenta — Solverix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a1810;
    --bg-deep: #06120b;
    --panel: #132118;
    --border: #2a4a38;
    --gold: #d4af37;
    --gold-bright: #e8c250;
    --text: #e8f0ea;
    --muted: #8fb39f;
    --muted-2: #5c7a6a;
    --green: #22c55e;
    --red: #ff5c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(1100px 520px at 82% -6%, rgba(212,175,55,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Inter","Segoe UI",sans-serif;
    line-height:1.55;
  }
  a{color:inherit;}
  h1,h2{font-family:"Cinzel","Segoe UI",serif; font-weight:700; margin:0;}
  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(10,24,16,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; max-width:640px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-family:"Cinzel",serif; font-weight:700; font-size:19px;}
  .brand .mark{color:var(--gold); font-size:20px;}
  .back-link{font-size:13.5px; color:var(--muted); text-decoration:none;}
  .back-link:hover{color:var(--text);}
  .page-wrap{max-width:640px; margin:0 auto; padding:56px 24px;}
  .page-head{text-align:center; margin-bottom:32px;}
  .page-head h1{font-size:26px;}
  .page-head p{color:var(--muted); font-size:14px; margin-top:10px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:8px; cursor:pointer;
    font-family:"Inter",sans-serif; font-weight:700; font-size:14px;
    padding:11px 22px; text-decoration:none; transition:transform .15s, background .15s;
  }
  .btn-gold{background:var(--gold); color:#14231a;}
  .btn-gold:hover{background:var(--gold-bright); transform:translateY(-1px);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--gold); color:var(--gold-bright);}

  .account-card{
    background:var(--panel); border:1px solid var(--border); border-left:6px solid var(--green);
    border-radius:4px 14px 14px 4px; padding:30px 32px;
  }
  .account-card .acc-row{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;}
  .account-card .acc-plan{font-size:19px; font-weight:800;}
  .account-card .acc-plan .dot-on{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--green); margin-right:8px; box-shadow:0 0 8px var(--green);}
  .account-card .acc-days{font-family:"Space Grotesk",sans-serif; font-weight:700; color:var(--gold-bright); font-size:15px;}
  .account-card .acc-sub{color:var(--muted); font-size:13.5px; margin-top:6px;}
  .acc-field-label{font-size:12.5px; color:var(--muted); margin:14px 0 6px;}
  .acc-input{
    width:100%; background:var(--bg-deep); border:1px solid var(--border); border-radius:8px;
    padding:11px 14px; color:var(--text); font-family:"Inter",sans-serif; font-size:14px;
  }
  .acc-input:focus{outline:none; border-color:var(--gold);}
  .acc-actions{display:flex; gap:12px; margin-top:22px;}
  .acc-actions .btn{flex:1;}
  .acc-status{margin-top:14px; font-size:13px; min-height:0;}
  .acc-status.err{color:var(--red);}
  .acc-status.ok{color:var(--green);}
  .acc-status.info{color:var(--muted);}
  .acc-download-btn{width:100%; justify-content:center;}
  .acc-plan-pick{display:flex; gap:10px; margin-top:12px;}
  .acc-plan-pick .btn{flex:1; font-size:12.5px; padding:12px 8px;}
  .mp-banner{
    background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--gold);
    padding:14px 20px; margin:0 0 24px; border-radius:8px; font-size:14px;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-row">
    <div class="brand"><span class="mark">♠</span> Solverix</div>
    <a class="back-link" href="index.html">← Volver a la landing</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-head">
    <h1>🔑 Mi cuenta</h1>
    <p>Iniciá sesión o registrate para adquirir un plan y descargar Solverix.</p>
  </div>

  <div id="mpBannerArea"></div>

  <div class="account-card" id="accountCard">
    <div id="loginBlock">
      <div class="acc-field-label">Email</div>
      <input class="acc-input" id="accEmail" type="email" autocomplete="username">
      <div class="acc-field-label">Contraseña</div>
      <input class="acc-input" id="accPassword" type="password" autocomplete="current-password">
      <div class="acc-actions">
        <button class="btn btn-gold" id="accLoginBtn">Iniciar sesión</button>
        <button class="btn btn-ghost" id="accRegisterBtn">Registrarme</button>
      </div>
      <div class="acc-status" id="accStatus"></div>
    </div>
    <div id="loggedInBlock" style="display:none;">
      <div class="acc-row">
        <div class="acc-plan"><span class="dot-on"></span><span id="accPlanName">Plan Completo</span> — activo</div>
        <div class="acc-days" id="accDays"></div>
      </div>
      <div class="acc-sub" id="accExpiry"></div>
      <div id="accDownloadArea" style="margin-top:20px;"></div>
      <a href="#" id="accLogoutLink" style="display:block; margin-top:14px; font-size:12.5px; color:var(--muted-2); text-decoration:underline;">Cerrar sesión</a>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://solverix-api-nicolastu-devs-projects.vercel.app';
  const DOWNLOAD_URL = 'https://github.com/NicolasTu-dev/NicoSolver/releases/download/solverix-v1/Solverix.zip';
  const PLAN_NAMES = { none: 'Sin suscripción', advanced: 'Solver Avanzado', complete: 'Completo' };

  // Affiliate link tracking: ?ref=codigo gets remembered for checkout,
  // even if the visitor lands here directly instead of via the landing.
  (function(){
    const ref = new URLSearchParams(window.location.search).get('ref');
    if(ref) localStorage.setItem('solverix_ref', ref.trim().toLowerCase());
  })();

  // ---------- Mercado Pago return handling ----------
  (function(){
    const params = new URLSearchParams(window.location.search);
    const mpStatus = params.get('mp');
    if(!mpStatus) return;
    const messages = {
      success: '✅ ¡Pago recibido! Iniciá sesión abajo para ver tu plan activo y descargar Solverix.',
      pending: '⏳ Tu pago está pendiente de aprobación. Iniciá sesión en unos minutos para ver el estado.',
      failure: '❌ El pago no se completó. Podés intentarlo de nuevo iniciando sesión abajo.',
    };
    if(messages[mpStatus]){
      const banner = document.createElement('div');
      banner.className = 'mp-banner';
      banner.textContent = messages[mpStatus];
      document.getElementById('mpBannerArea').appendChild(banner);
    }
  })();

  const loginBlock = document.getElementById('loginBlock');
  const loggedInBlock = document.getElementById('loggedInBlock');
  const accEmail = document.getElementById('accEmail');
  const accPassword = document.getElementById('accPassword');
  const accStatus = document.getElementById('accStatus');
  const accLoginBtn = document.getElementById('accLoginBtn');
  const accRegisterBtn = document.getElementById('accRegisterBtn');
  const accPlanName = document.getElementById('accPlanName');
  const accDays = document.getElementById('accDays');
  const accExpiry = document.getElementById('accExpiry');
  const accDownloadArea = document.getElementById('accDownloadArea');
  const accLogoutLink = document.getElementById('accLogoutLink');

  function setStatus(msg, kind){
    accStatus.textContent = msg;
    accStatus.className = 'acc-status' + (kind ? ' ' + kind : '');
  }

  function daysUntil(iso){
    if(!iso) return 0;
    const ms = new Date(iso).getTime() - Date.now();
    return Math.max(0, Math.ceil(ms / 86400000));
  }

  async function apiCall(path, body){
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return res.json().catch(() => ({ ok: false, error: 'bad_response' }));
  }

  function showLoggedIn(email, plan, expiresAt){
    loginBlock.style.display = 'none';
    loggedInBlock.style.display = 'block';
    accPlanName.textContent = PLAN_NAMES[plan] || plan;
    accDays.textContent = daysUntil(expiresAt) + ' días restantes';
    accExpiry.textContent = 'Vence el ' + new Date(expiresAt).toLocaleDateString('es-AR');
    accDownloadArea.innerHTML =
      '<a class="btn btn-gold acc-download-btn" href="' + DOWNLOAD_URL + '">⬇ Descargar Solverix</a>' +
      '<div style="font-size:11.5px; color:var(--muted-2); margin-top:8px; text-align:center;">La app desbloquea tu plan automáticamente al iniciar sesión adentro.</div>';
  }

  function showNoPlan(email){
    loginBlock.style.display = 'none';
    loggedInBlock.style.display = 'block';
    accPlanName.textContent = 'Sin suscripción';
    accDays.textContent = '';
    accExpiry.textContent = 'Adquirí un plan para poder descargar Solverix.';
    accDownloadArea.innerHTML =
      '<div class="acc-plan-pick">' +
      '<button class="btn btn-ghost" id="pickAdvanced">Adquirir Avanzado</button>' +
      '<button class="btn btn-gold" id="pickComplete">Adquirir Completo</button>' +
      '</div>' +
      '<div id="checkoutStatus" class="acc-status"></div>';
    document.getElementById('pickAdvanced').onclick = () => startCheckout(email, 'advanced');
    document.getElementById('pickComplete').onclick = () => startCheckout(email, 'complete');
  }

  async function startCheckout(email, plan){
    const statusEl = document.getElementById('checkoutStatus');
    if(statusEl){ statusEl.textContent = 'Abriendo Mercado Pago...'; statusEl.className = 'acc-status info'; }
    const ref = localStorage.getItem('solverix_ref') || undefined;
    const result = await apiCall('/api/create-checkout', { email, plan, ref });
    if(!result.ok || !result.checkoutUrl){
      if(statusEl){ statusEl.textContent = 'No se pudo iniciar el pago. Probá de nuevo.'; statusEl.className = 'acc-status err'; }
      return;
    }
    window.location.href = result.checkoutUrl;
  }

  accLoginBtn.addEventListener('click', async () => {
    const email = accEmail.value.trim();
    const password = accPassword.value;
    if(!email || !password){ setStatus('Completá email y contraseña.', 'err'); return; }
    setStatus('Conectando...', 'info');
    const result = await apiCall('/api/login', { email, password });
    if(!result.ok){
      setStatus(result.error === 'invalid_credentials' ? 'Email o contraseña incorrectos.' : 'No se pudo conectar.', 'err');
      return;
    }
    if(result.active){
      showLoggedIn(email, result.plan, result.expiresAt);
    }else{
      showNoPlan(email);
    }
  });

  accRegisterBtn.addEventListener('click', async () => {
    const email = accEmail.value.trim();
    const password = accPassword.value;
    if(!email || !password){ setStatus('Completá email y contraseña.', 'err'); return; }
    setStatus('Creando cuenta...', 'info');
    const result = await apiCall('/api/register', { email, password });
    if(!result.ok){
      const messages = {
        email_already_registered: 'Ese email ya está registrado — iniciá sesión.',
        password_too_short: 'La contraseña necesita al menos 4 caracteres.',
      };
      setStatus(messages[result.error] || 'No se pudo registrar.', 'err');
      return;
    }
    setStatus('¡Cuenta creada! Ahora tocá "Iniciar sesión".', 'ok');
  });

  accLogoutLink.addEventListener('click', (e) => {
    e.preventDefault();
    loggedInBlock.style.display = 'none';
    loginBlock.style.display = 'block';
    accEmail.value = '';
    accPassword.value = '';
    setStatus('', '');
  });
</script>

</body>
</html>
